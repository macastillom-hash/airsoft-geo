name: Encrypted Airsoft Geo backups

on:
  schedule:
    # 03:15 Colombia (America/Bogota), 08:15 UTC
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: encrypted-airsoft-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Install age encryption
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
      - name: Export, verify and encrypt PostgreSQL and Storage
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: bash scripts/run-encrypted-backup.sh
      - name: Upload ONLY encrypted recovery archive
        uses: actions/upload-artifact@v4
        with:
          name: airsoft-geo-encrypted-backup
          path: |
            .backup-output/*.age
            .backup-output/*.age.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
