name: Airsoft Geo V3 checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/airsoft-v3-activities]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check V2 backward compatibility
        run: npm run test:phase2
      - name: Check V3 activity integration
        run: node tests/fase3-sanity.mjs
      - name: Check V4 administration and push
        run: npm run test:phase4
      - name: Verify offline backup integrity handling
        run: node tests/backup-integrity.mjs
      - name: Test PostgreSQL 17 recovery in isolated container
        run: bash -x tests/staging-restore-smoke.sh
      - name: Check V5 map, profiles, and permissions
        run: node tests/fase5-sanity.mjs
      - name: Check V5.2 GPS, navigation and activity timer
        run: npm run test:phase52
      - name: Build production bundle
        run: npm run build
      - name: Verify React dashboard with a real mobile browser
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          VITE_SUPABASE_URL=https://smoke.supabase.co VITE_SUPABASE_ANON_KEY=synthetic-public-key npm run dev -- --host 127.0.0.1 > /tmp/airsoft-vite-smoke.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/tests/browser-smoke.html >/dev/null; then break; fi
            sleep 2
          done
          node tests/browser-smoke.mjs
