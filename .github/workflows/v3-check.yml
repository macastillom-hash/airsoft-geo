name: Airsoft Geo V3 checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/airsoft-v3-activities]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check V2 backward compatibility
        run: npm run test:phase2
      - name: Check V3 activity integration
        run: node tests/fase3-sanity.mjs
      - name: Build production bundle
        run: npm run build
